<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="基于已收录法律法规的智能问答工具">
    <title>法律法规问答</title>
    <link rel="stylesheet" href="/static/styles.css">
  </head>
  <body>
    <a class="skip-link" href="#question">跳至提问</a>
    <div class="workspace">
      <aside class="conversation-sidebar" aria-label="对话列表">
        <div class="sidebar-heading"><span>法律法规问答</span><button id="new-conversation" type="button">+ 新建对话</button></div>
        <nav id="conversation-list" aria-label="历史对话"></nav>
      </aside>
    <div class="app-shell">
      <header class="site-header">
        <div>
          <p class="eyebrow">LEGAL RAG</p>
          <h1 id="current-conversation-title">新对话</h1>
        </div>
        <p class="header-note">基于已收录法规检索生成</p>
      </header>

      <section class="notice" aria-label="使用说明">
        <strong>使用提示：</strong>回答仅供法律信息参考，不构成针对个案的法律意见。
      </section>

      <main id="message-log" class="message-log" aria-live="polite" aria-label="对话记录">
        <section class="welcome-card" id="welcome-card">
          <p class="eyebrow">开始咨询</p>
          <h2>请输入一条劳动法律法规问题</h2>
          <p>系统会结合当前对话，将追问改写为适合检索的问题，再提供相关法条来源。</p>
        </section>
      </main>

      <section id="status" class="status" role="status" aria-live="polite"></section>

      <form id="chat-form" class="chat-form">
        <label for="question">你的问题</label>
        <div class="composer">
          <textarea id="question" name="question" rows="3" maxlength="2000" placeholder="例如：试用期最长多久？" required></textarea>
          <button id="send-button" type="submit">
            <span>发送</span>
            <span class="button-hint" aria-hidden="true">Enter</span>
          </button>
        </div>
        <p class="form-hint">Enter 发送，Shift + Enter 换行</p>
      </form>
    </div></div>
    <template id="source-template">
      <details class="sources">
        <summary>查看参考来源</summary>
        <ul></ul>
      </details>
    </template>
    <dialog id="rename-dialog" class="rename-dialog" aria-labelledby="rename-dialog-title">
      <form id="rename-form" method="dialog">
        <h2 id="rename-dialog-title">重命名聊天</h2>
        <label for="rename-input">聊天名称</label>
        <input id="rename-input" name="title" type="text" maxlength="80" required>
        <p id="rename-error" class="dialog-error" role="alert"></p>
        <div class="dialog-actions">
          <button id="rename-cancel" type="button" class="secondary-button">取消</button>
          <button type="submit">保存</button>
        </div>
      </form>
    </dialog>
    <script type="module" src="/static/app.js"></script>
  </body>
</html>
